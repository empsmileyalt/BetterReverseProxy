events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Define the backend connection characteristics
    upstream eagler_backend {
        server 89.117.77.192:25638;
    }

    server {
        # Render forces us to listen on standard port 80
        listen 80;
        server_name localhost;

        location / {
            # Route connection packets directly to your Minecraft proxy
            proxy_pass http://eagler_backend;

            # Core parameters required for WebSocket communication
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Pass real visitor IP parameters downstream 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended connection timeout windows for gaming
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
