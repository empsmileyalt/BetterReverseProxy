events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream eagler_backend {
        server 89.117.77.192:25638;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. INTERCEPT RENDER HEALTH CHECKS
        # This stops Render from breaking the proxy connection
        location = /healthz {
            access_log off;
            return 200 'healthy';
            add_header Content-Type text/plain;
        }

        # 2. EAGLERCRAFT WEBSOCKET ROUTE
        location / {
            proxy_pass http://eagler_backend;

            # Core WebSocket parameters
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Pass real visitor IP parameters downstream 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep active gaming connections open
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
