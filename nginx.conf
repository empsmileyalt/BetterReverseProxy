events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Detailed Game Connect Log Format
    log_format eagler_debug '[GAME CONNECT] Time: $time_local | '
                            'Client IP: $remote_addr | '
                            'Request: "$request" | '
                            'Status: $status | '
                            'Upstream (Minecraft): $upstream_addr | '
                            'Upstream Status: $upstream_status | '
                            'WS Upgrade Header: "$http_upgrade" | '
                            'WS Connection Header: "$http_connection"';

    upstream eagler_backend {
        server 89.117.77.192:25643;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. ROOT PATH AND CACHED PATH CATCH-ALL
        # This location catch-all block fixes browser caching issues
        location / {
            # Redirect normal HTTP browser/health traffic to /web
            if ($http_upgrade != "websocket") {
                return 302 /web;
            }

            # Console logging variables
            access_log /dev/stdout eagler_debug;
            error_log /dev/stdout info;

            # FORCING THE TRAILING SLASH STRIPS ALL SUB-PATHS (like /connect)
            proxy_pass http://eagler_backend/;

            # WebSocket upgrade logic
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Real Visitor IP Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Anti-lag adjustments
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 2. RENDER HEALTH CHECK PATH
        location /web {
            access_log off; 
            return 200 "Eaglercraft Reverse Proxy Operational";
            add_header Content-Type text/plain;
        }
    }
}
