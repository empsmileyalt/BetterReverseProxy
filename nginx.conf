events {
    worker_connections 1024;
}

http {
    upstream eagler_backend {
        server 89.117.77.192:25638;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://eagler_backend;

            # Forces Nginx to upgrade the connection to a WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Pass clean network headers to your Minecraft server
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering so game packets don't lag or get stuck
            proxy_buffering off;

            # Keep active player connections open for up to an hour
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
