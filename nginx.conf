events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream velocity_backend {
        # Points right to your solid primary port loop on PrismaticSky
        server 89.117.77.192:25643;
    }

    server {
        # Standard default container port
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://velocity_backend;

            # Core WebSocket protocol upgrades
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Real Visitor IP Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL LAG FIX: Instantly flush game packets
            proxy_buffering off;
            proxy_request_buffering off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
