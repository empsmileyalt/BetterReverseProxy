events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream velocity_backend {
        # Points directly to your working dual-stack primary port
        server 89.117.77.192:25638;
    }

    server {
        # Zeabur automatically reads port 80 or 8080 for web services
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://velocity_backend;

            # Core WebSocket protocol upgrades
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Real Visitor IP Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL LAG FIX: Force instant packet delivery
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Wide timeouts to keep active gaming streams online
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
