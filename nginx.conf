events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream eagler_backend {
        server 89.117.77.192:25638;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. RENDER HEALTH CHECK PATH
        # Satisfies Render completely without hitting the Minecraft server
        location / {
            return 200 "Eaglercraft Reverse Proxy Operational";
            add_header Content-Type text/plain;
        }

        # 2. GAME CLIENT WEBSOCKET PATH
        # Dedicated strictly for player connections
        location /connect {
            proxy_pass http://eagler_backend/;

            # WebSocket upgrade parameters
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Forward real player IPs
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Performance adjustments for active gaming
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
