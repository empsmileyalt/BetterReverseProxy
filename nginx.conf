events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream eagler_backend {
        # PORT CHANGED TO PRIMARY FOR INJECTION INTERFACES
        server 89.117.77.192:25638;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. ROOT PATH - GAME CONNECTIONS ONLY
        location / {
            if ($http_upgrade != "websocket") {
                return 302 /web;
            }

            proxy_pass http://eagler_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 2. RENDER HEALTH CHECK PATH
        location /web {
            access_log off; 
            return 200 "Eaglercraft Reverse Proxy Operational";
            add_header Content-Type text/plain;
        }
    }
}
