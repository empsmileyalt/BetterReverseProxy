events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream eagler_backend {
        server 89.117.77.192:25638;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            # Intercept Render's automated health checks (GET / and HEAD /)
            # This returns a 200 OK directly from Nginx and protects the Minecraft server
            if ($http_upgrade != "websocket") {
                return 200 "Eaglercraft Reverse Proxy Operational";
                add_header Content-Type text/plain;
            }

            # Forward valid game client connections to Eaglercraft
            proxy_pass http://eagler_backend;

            # Core parameters required for WebSocket communication
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Pass real visitor IP parameters downstream 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering so game packets stream instantly without lag
            proxy_buffering off;

            # Extended connection timeout windows for gaming
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
